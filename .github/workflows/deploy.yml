name: Deploy Underduck Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# 필요한 레포 시크릿: LIGHTSAIL_HOST, LIGHTSAIL_KEY (cosmic-hustle와 동일 서버/키)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test          # 테스트 통과해야만 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          source: "."
          target: "~/underduck-backend"
          strip_components: 0
          rm: false

      - name: Install dependencies & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            cd ~/underduck-backend
            test -d .venv || python3 -m venv .venv
            .venv/bin/pip install -r requirements.txt -q
            # scp rm:false로 인해 리네임/삭제된 마이그레이션이 서버에 남을 수 있으므로
            # 리포에 없는 .py 파일을 alembic/versions에서 정리한다.
            for f in alembic/versions/*.py; do
              bn=$(basename "$f")
              if ! git ls-files --error-unmatch "alembic/versions/$bn" >/dev/null 2>&1; then
                echo "Removing stale migration: $bn"
                rm -f "$f"
              fi
            done
            .venv/bin/alembic upgrade head
            sudo systemctl restart underduck-backend
            echo "underduck-backend 재시작 완료"
