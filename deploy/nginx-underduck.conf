# /etc/nginx/sites-available/underduck  (sites-enabled에 symlink)
#
# 전제: 서버에 nginx 미설치 상태였음. 설치 + TLS 발급 순서:
#   sudo apt-get update && sudo apt-get install -y nginx certbot python3-certbot-nginx
#   # DNS: underduck-api.<도메인> A레코드 -> 3.36.239.214 (전파 확인 후)
#   sudo cp deploy/nginx-underduck.conf /etc/nginx/sites-available/underduck
#   sudo ln -s /etc/nginx/sites-available/underduck /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d underduck-api.<도메인>   # 443 + 인증서 자동 구성
#
# certbot 실행 후 이 파일에 listen 443 ssl 블록과 인증서 경로가 자동 추가됨.
# Lightsail 방화벽에서 80/443 인바운드도 열어야 함.

# 레이트리밋 존. sites-enabled/* 는 http{} 안에서 include 되므로 여기 선언해도 유효하다.
# 10r/s + burst 40(nodelay) — 대시보드 한 화면이 여러 엔드포인트를 동시에 부르는 것은
# burst 안에서 흡수되고, 스크래핑/브루트포스만 걸린다.
limit_req_zone $binary_remote_addr zone=underduck:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name underduck-api.example.com;  # TODO: 실제 서브도메인으로 교체

    # 저장 폭탄 방지 (사진 URL만 저장하고 파일 업로드는 없으므로 1MB로 충분)
    client_max_body_size 1m;
    server_tokens off;

    location / {
        limit_req zone=underduck burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
